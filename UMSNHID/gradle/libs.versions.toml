[versions]
agp = "8.9.2"
datastoreCore = "1.1.3"
kotlin = "2.1.10"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.03.00"
#Dependencias
navigationCompose = "2.8.9"
kotlinSerialization = "1.8.0"#La version depende de que kotlin uses
materialIconsExtended = "1.7.8"
ktor = "3.1.1"
koin = "4.0.2"
mlkit = "17.3.0"
camerax = "1.5.0-alpha06"
permissions = "0.37.2"
zxing = "3.5.3"
datastorePreferences = "1.1.3"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastoreCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
#Dependencias
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose"}
kotlinx-serialization-json = {module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerialization"}
material-icons-extended = {module = "androidx.compose.material:material-icons-extended", version.ref="materialIconsExtended"}
#ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
#koin
koin-android= { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose= { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
#Leer Qr
mlkit-barcode = {module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit"}
#Generar Qr
google-zxing = {module = "com.google.zxing:core" , version.ref = "zxing" }
#camera
camera-core = {module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = {module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = {module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = {module = "androidx.camera:camera-view", version.ref = "camerax" }
camera-mlkit-vision = {module = "androidx.camera:camera-mlkit-vision" , version.ref = "camerax"}
#Permisos
accompanist-permissions = {module = "com.google.accompanist:accompanist-permissions", version.ref = "permissions" }
#datastore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
#plugins
jetbrainsKotlinSerialization = {id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}



[bundles]
ktor = [
    "ktor-client-core",
    "ktor-client-okhttp",
    "ktor-client-content-negotiation",
    "ktor-serialization-kotlinx-json",
    "ktor-client-logging"
]
koin = [
    "koin-android",
    "koin-androidx-compose"
]
camera = [
    "camera-core",
    "camera-camera2",
    "camera-lifecycle",
    "camera-view",
    "camera-mlkit-vision"
]

