spring:
    application:
        name: umsnhid
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/umsnh}
        username: ${DB_USERNAME:umsnh}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 10
        pool-name: "umsnh"
    security:
        user:
            name: ${APP_USER:admin}
            password: ${APP_PASSWORD}
server:
    port: 8081
jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 horas en milisegundos